name: Experimental shared writer
on:
  push:
    paths:
      - 'experimental/shared-writer/**'
      - '.github/workflows/shared-writer.yml'
      - 'super.c'
  pull_request:
    paths:
      - 'experimental/shared-writer/**'
      - '.github/workflows/shared-writer.yml'
      - 'super.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transaction-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify durable image transactions and interrupted recovery
        run: python3 experimental/shared-writer/test-durable.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify incremental log bounds and interrupted block replay
        run: python3 experimental/shared-writer/test-block-log.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save validation summary
        uses: actions/upload-artifact@v4
        with:
          name: transaction-logs-validation
          path: |
            ${{ runner.temp }}/shared-writer/matrix-results.json
            ${{ runner.temp }}/shared-writer/durable-results.json
            ${{ runner.temp }}/shared-writer/block-log-results.json

  overlay-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify direct C overlay capture and failed producers
        run: python3 experimental/shared-writer/test-overlay-log.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify disposable in-place commits and torn-page recovery
        run: python3 experimental/shared-writer/test-inplace.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save validation summary
        uses: actions/upload-artifact@v4
        with:
          name: overlay-recovery-validation
          path: |
            ${{ runner.temp }}/shared-writer/matrix-results.json
            ${{ runner.temp }}/shared-writer/overlay-log-results.json
            ${{ runner.temp }}/shared-writer/inplace-results.json

  chain-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify transaction chains and resident reader refresh
        run: python3 experimental/shared-writer/test-chain.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify checkpoints and interrupted log retirement
        run: python3 experimental/shared-writer/test-checkpoint.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save validation summary
        uses: actions/upload-artifact@v4
        with:
          name: chain-recovery-validation
          path: |
            ${{ runner.temp }}/shared-writer/matrix-results.json
            ${{ runner.temp }}/shared-writer/chain-results.json
            ${{ runner.temp }}/shared-writer/checkpoint-results.json

  writer-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify caller-data write API and atomic mutation batches
        run: python3 experimental/shared-writer/test-write-api.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify coordinated resident reader sessions and competing requests
        run: python3 experimental/shared-writer/test-session.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save validation summary
        uses: actions/upload-artifact@v4
        with:
          name: writer-sessions-validation
          path: |
            ${{ runner.temp }}/shared-writer/matrix-results.json
            ${{ runner.temp }}/shared-writer/write-api-results.json
            ${{ runner.temp }}/shared-writer/session-results.json

  namespace-lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify regular-file namespace and durable orphan lifetime
        run: python3 experimental/shared-writer/test-namespace.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save namespace validation summary
        uses: actions/upload-artifact@v4
        with:
          name: namespace-lifetime-validation
          path: ${{ runner.temp }}/shared-writer/namespace-results.json

  directory-symlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify directory topology and no-follow symlink mutations
        run: python3 experimental/shared-writer/test-directories.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save directory and symlink validation summary
        uses: actions/upload-artifact@v4
        with:
          name: directory-symlink-validation
          path: ${{ runner.temp }}/shared-writer/directories-results.json

  directory-references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build existing reader and experimental overlay with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Check overlay publication, randomized reads and resource limits
        run: '"$RUNNER_TEMP/shared-writer/overlay-unit"'
      - name: Verify mutations, rollback and independent filesystem integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify directory handles, cwd and removed ancestry lifetime
        run: python3 experimental/shared-writer/test-directory-refs.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save directory reference validation summary
        uses: actions/upload-artifact@v4
        with:
          name: directory-reference-validation
          path: ${{ runner.temp }}/shared-writer/directory-refs-results.json

  openat-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build reader and staged writer with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Verify filesystem fixtures and overlay integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify inode-relative open flags, namespace, symlink traversal and recovery
        run: python3 experimental/shared-writer/test-openat.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save openat validation summary
        uses: actions/upload-artifact@v4
        with:
          name: openat-validation
          path: ${{ runner.temp }}/shared-writer/openat-results.json

  directory-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build reader and directory stream limit helper with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Verify filesystem fixtures and overlay integrity
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify directory offsets, pagination, snapshots and resource lifetime
        run: python3 experimental/shared-writer/test-directory-streams.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save directory stream validation summary
        uses: actions/upload-artifact@v4
        with:
          name: directory-stream-validation
          path: ${{ runner.temp }}/shared-writer/directory-streams-results.json

  metadata-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build metadata engine with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Prepare and validate filesystem profiles
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify native ACL editing representability model
        run: python3 experimental/shared-writer/test-native-acl-edit.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify native inheritance equivalence, transactions and recovery
        run: |
          python3 experimental/shared-writer/test-native-inherit.py --work "$RUNNER_TEMP/shared-writer"
          python3 experimental/shared-writer/test-native-inherit-transactions.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify metadata authority, ACL consistency, lifetime and recovery
        run: python3 experimental/shared-writer/test-metadata.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save metadata mutation validation
        uses: actions/upload-artifact@v4
        with:
          name: metadata-mutation-validation
          path: |
            ${{ runner.temp }}/shared-writer/metadata-results.json
            ${{ runner.temp }}/shared-writer/native-acl-edit-results.json
            ${{ runner.temp }}/shared-writer/native-inherit-results.json
            ${{ runner.temp }}/shared-writer/native-inherit-transactions.json

  mount-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build mounted broker and native reader with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Prepare and validate filesystem profiles
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify mounted metadata, credentials, cleanup and protocol
        run: python3 experimental/shared-writer/test-mount-broker.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save mount broker validation summary
        uses: actions/upload-artifact@v4
        with:
          name: mount-broker-validation
          path: ${{ runner.temp }}/shared-writer/mount-broker-results.json

  mounted-fuse3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native FUSE mount and filesystem dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Require a working FUSE device
        run: sudo modprobe fuse && test -c /dev/fuse && test -x /usr/bin/fusermount3
      - name: Build experimental mounted frontend with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/shared-writer" --sanitize
      - name: Prepare and independently validate filesystem profiles
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify real mounted mutations, inode handles and recovery
        run: python3 experimental/shared-writer/test-mounted-writer.py --work "$RUNNER_TEMP/shared-writer"
      - name: Verify real mounted metadata and copy preservation
        run: python3 experimental/shared-writer/test-mounted-metadata.py --work "$RUNNER_TEMP/shared-writer"
      - name: Save mounted validation and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mounted-fuse3-validation
          path: |
            ${{ runner.temp }}/shared-writer/mounted-writer-results.json
            ${{ runner.temp }}/shared-writer/mounted-metadata-results.json
            ${{ runner.temp }}/shared-writer/mounted-metadata-*/*-mount.log
            ${{ runner.temp }}/shared-writer/mounted-writer-*/**/*-mount.log

  permission-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs pkg-config
      - name: Build policy-enabled reader and writer with sanitizers
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/policy-writer" --sanitize
      - name: Verify ACL decisions and inheritance against an independent oracle
        run: '"$RUNNER_TEMP/policy-writer/policy-unit"'
      - name: Prepare and validate filesystem configurations
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/policy-writer"
      - name: Verify credential-bound sessions and committed ACL metadata
        run: python3 experimental/shared-writer/test-policy.py --work "$RUNNER_TEMP/policy-writer"
      - name: Verify existing-file handle grants, identity and interrupted recovery
        run: python3 experimental/shared-writer/test-handles.py --work "$RUNNER_TEMP/policy-writer"
      - name: Save policy validation summary
        uses: actions/upload-artifact@v4
        with:
          name: permission-policy-validation
          path: |
            ${{ runner.temp }}/policy-writer/policy-results.json
            ${{ runner.temp }}/policy-writer/handles-results.json

  device-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install device and filesystem test dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev libext2fs-dev e2fsprogs util-linux fdisk pkg-config
      - name: Build isolated device publication test runtime
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/device-writer" --sanitize
      - name: Verify guarded replay, torn sectors and rejection paths
        run: python3 experimental/shared-writer/test-device-writer.py --work "$RUNNER_TEMP/device-writer"
      - name: Verify actual disposable loop-device publication and recovery
        run: |
          sudo modprobe loop
          sudo env PATH="$PATH" python3 experimental/shared-writer/test-device-native.py --work "$RUNNER_TEMP/device-writer"
      - name: Verify partition claims, mounted siblings and partition recovery
        run: sudo env PATH="$PATH" python3 experimental/shared-writer/test-device-native.py --work "$RUNNER_TEMP/device-writer" --partition
      - name: Save device validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-publication-validation
          path: |
            ${{ runner.temp }}/device-writer/device-replay-results.json
            ${{ runner.temp }}/device-writer/device-native-results.json
            ${{ runner.temp }}/device-writer/device-native-partition-results.json
