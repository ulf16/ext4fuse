  durability-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install endurance and FUSE dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev libext2fs-dev e2fsprogs pkg-config gh
      - uses: ./.github/actions/writer-e2fsprogs
      - name: Require native FUSE
        run: sudo modprobe fuse && test -c /dev/fuse
      # A report-collection correction must not require repeating an already
      # qualified long workload. Validate provenance and identical non-workflow
      # sources before accepting retained results; never reuse after code edits.
      - name: Verify retained endurance provenance
        if: ${{ inputs.reuse_endurance_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_endurance_run }}
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" > "$RUNNER_TEMP/retained-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/retained-jobs.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root/'retained-run.json').read_text())
          assert run['status'] == 'completed'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          sha = run['head_sha']
          assert len(sha) == 40 and all(c in '0123456789abcdef' for c in sha)
          jobs = json.loads((root/'retained-jobs.json').read_text())['jobs']
          job = next(j for j in jobs if j['name'] == 'durability-endurance')
          for name in ('Verify sustained mixed transactions and storage failures on all profiles',
                       'Verify prolonged mixed mounted writes across repeated process loss'):
              assert next(s for s in job['steps'] if s['name'] == name)['conclusion'] == 'success'
          (root/'retained-sha').write_text(sha)
          PYCODE
          retained_sha="$(cat "$RUNNER_TEMP/retained-sha")"
          git fetch --no-tags --depth=1 origin "$retained_sha"
          test -z "$(git diff --name-only "$retained_sha" HEAD -- . ':!.github/workflows/shared-writer.yml')"
      - name: Restore qualified long-workload reports
        if: ${{ inputs.reuse_endurance_run }}
        uses: actions/download-artifact@v4
        with:
          name: endurance-validation
          path: ${{ runner.temp }}/endurance
          run-id: ${{ inputs.reuse_endurance_run }}
          github-token: ${{ github.token }}
      - name: Require complete retained endurance results
        if: ${{ inputs.reuse_endurance_run }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'endurance'
          profile = json.loads((root/'endurance-results.json').read_text())
          mounted = json.loads((root/'mounted-endurance-results.json').read_text())
          assert profile['result'] == 'passed' and len(profile['profiles']) == 12
          assert profile['rounds'] >= 240
          assert mounted['result'] == 'passed' and mounted['elapsed_seconds'] >= 1200
          assert mounted['requested_seconds'] >= 1200 and mounted['cycles'] >= 3
          assert mounted['writers'] == 2 and mounted['acknowledgements'] >= 96
          PYCODE
      - name: Build endurance runtime with sanitizers
        if: ${{ !inputs.reuse_endurance_run }}
        run: python3 experimental/shared-writer/build.py --work "$RUNNER_TEMP/endurance" --sanitize
      - name: Prepare independently checked filesystem profiles
        if: ${{ !inputs.reuse_endurance_run }}
        run: python3 experimental/shared-writer/run-matrix.py --work "$RUNNER_TEMP/endurance"
      - name: Verify sustained mixed transactions and storage failures on all profiles
        if: ${{ !inputs.reuse_endurance_run }}
        run: python3 experimental/shared-writer/test-endurance.py --work "$RUNNER_TEMP/endurance" --rounds 240 --seed 918273
      - name: Install mounted endurance runtime
        if: ${{ !inputs.reuse_endurance_run }}
        run: python3 experimental/shared-writer/install.py --prefix "$RUNNER_TEMP/endurance-prefix" --build-dir "$RUNNER_TEMP/endurance" --python "$(command -v python3)" --version 0.3.0-beta.6
      - name: Verify prolonged mixed mounted writes across repeated process loss
        if: ${{ !inputs.reuse_endurance_run }}
        env:
          SOAK_SECONDS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.soak_seconds) || '1200' }}
        run: |
          python3 -c 'import os; n=float(os.environ["SOAK_SECONDS"]); assert 0 <= n <= 3600, "soak_seconds must be 0..3600"'
          python3 experimental/shared-writer/test-mounted-endurance.py --work "$RUNNER_TEMP/endurance" --prefix "$RUNNER_TEMP/endurance-prefix" --cycles 3 --acks 32 --duration "$SOAK_SECONDS"
      - name: Build normal helpers for hard address-space limits
        run: python3 experimental/shared-writer/build.py --runtime-only --work "$RUNNER_TEMP/endurance-memory"
      - name: Verify constrained-memory recovery after sustained writes
        run: |
          python3 experimental/shared-writer/test-resource-exhaustion.py --work "$RUNNER_TEMP/endurance-memory" --phase memory
          cp "$RUNNER_TEMP/endurance-memory/resource-exhaustion-memory-results.json" "$RUNNER_TEMP/endurance/resource-exhaustion-results.json"
      - name: Save endurance qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-validation
          path: |
            ${{ runner.temp }}/endurance/endurance-results.json
            ${{ runner.temp }}/endurance/mounted-endurance-results.json
            ${{ runner.temp }}/endurance/resource-exhaustion-results.json
            ${{ runner.temp }}/endurance/mounted-endurance-*/*.log
            ${{ runner.temp }}/endurance/mounted-endurance-*/acknowledgements.jsonl

