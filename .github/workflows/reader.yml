name: Reader regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        fuse: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev libfuse3-dev pkg-config e2fsprogs libext2fs-dev
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: make -j2 FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Test disposable ext4 images without mounting
        run: make test-images FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Reject unsupported features and malformed metadata
        run: make test-features FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Validate directory and extent errors against corrupted fixtures
        run: make test-corruption FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify metadata checksums and reject byte corruption
        run: make test-checksums FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify ownership and upstream path regressions
        run: make test-attributes FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify large sparse files and indirect/extent boundaries
        run: make test-large FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify inline files and directories
        run: make test-inline FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify signed extended timestamps and field presence
        run: make test-timestamps FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify distributed meta_bg descriptor layouts
        run: make test-meta-bg FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify inode and external-block extended attributes
        run: make test-xattrs FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify large EA inode values and integrity checks
        run: make test-ea-inode FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify three-level largedir indexes and directory cursors
        run: make test-largedir FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify physical-device capacity query bounds and errors
        run: make test-device-capacity FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify indexed lookup hashes, names, corrupt paths and block-read cost
        run: make test-indexed FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify real hash collisions across leaf and index boundaries
        run: make test-index-collisions FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify actual read-only Linux loop-device capacity and reads
        run: python3 test/device-capacity-linux.py
      - name: Verify filesystem space and inode reporting
        run: make test-statfs FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify classic block-map run boundaries, holes and errors
        run: make test-indirect-runs FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'

  bulk-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config e2fsprogs libext2fs-dev
      - name: Build optimized profiling harness
        run: make -j2 test/bulk-reader FUSE_API=3 CFLAGS=-O2
      - name: Compare warm reader, raw host, e2fsprogs and native ext4 reads
        run: python3 test/bulk-benchmark.py --native-linux --output bulk-benchmark.json
      - name: Save benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: linux-bulk-benchmark
          path: bulk-benchmark.json
