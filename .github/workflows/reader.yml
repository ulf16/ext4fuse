name: Reader regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        fuse: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev libfuse3-dev pkg-config e2fsprogs
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: make -j2 FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Test disposable ext4 images without mounting
        run: make test-images FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Reject unsupported features and malformed metadata
        run: make test-features FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Validate directory and extent errors against corrupted fixtures
        run: make test-corruption FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify metadata checksums and reject byte corruption
        run: make test-checksums FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify ownership and upstream path regressions
        run: make test-attributes FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
      - name: Verify large sparse files and indirect/extent boundaries
        run: make test-large FUSE_API=${{ matrix.fuse }} CFLAGS='-O1 -g -fsanitize=address,undefined'
